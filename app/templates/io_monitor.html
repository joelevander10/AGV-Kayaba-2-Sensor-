<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGV — IO Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #d4d0c8;
    color: #000;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 20px;
    padding: 15px;
    padding-bottom: 101px;
  }

  .raised {
    border-top:    2px solid #fff;
    border-left:   2px solid #fff;
    border-right:  2px solid #808080;
    border-bottom: 2px solid #808080;
  }

  #header {
    display: flex;
    align-items: center;
    gap: 24px;
    background: #000080;
    color: #fff;
    padding: 10px 19px;
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 22px;
    letter-spacing: 2px;
  }
  #header .title { flex: 1; }
  #ts { font-size: 18px; color: #c0c0c0; letter-spacing: 1px; }

  .mode-badge {
    padding: 2px 28px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    border-top:    2px solid #808080;
    border-left:   2px solid #808080;
    border-right:  2px solid #fff;
    border-bottom: 2px solid #fff;
    background: #c0c0c0; color: #000;
  }
  .mode-manual    { background: #0000c0; color: #fff; }
  .mode-armed     { background: #c0a000; color: #000; }
  .mode-running   { background: #008000; color: #fff; }
  .mode-reversing { background: #b06000; color: #fff; }
  .mode-emergency { background: #c00000; color: #fff; }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .panel { background: #c0c0c0; padding: 0; }
  .panel-title {
    background: #000080;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 2px;
    padding: 6px 15px;
    text-transform: uppercase;
  }
  .panel-body { padding: 0; }

  .io-row {
    display: flex;
    align-items: center;
    height: 48px;
    border-bottom: 1px solid #b0b0b0;
  }
  .io-row:last-child { border-bottom: none; }

  .io-idx {
    width: 62px;
    flex-shrink: 0;
    font-size: 15px;
    color: #505050;
    padding: 0 8px;
    border-right: 1px solid #a0a0a0;
    height: 100%;
    display: flex;
    align-items: center;
    background: #b8b4ac;
  }
  .io-name {
    flex: 1;
    padding: 0 15px;
    font-size: 19px;
    font-weight: bold;
    color: #000;
    letter-spacing: 0.10px;
  }
  .io-name.spare { color: #909090; font-weight: normal; font-style: italic; }

  .lamp {
    width: 31px; height: 31px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-right: 12px;
    background: #666;
    border: 2px solid #444;
    box-shadow: inset 0 1px 2px #00000044;
  }
  .lamp.on {
    background: radial-gradient(circle at 35% 35%, #ffee80, #c8a000);
    border-color: #806000;
    box-shadow: 0 0 10px 2px #ffc00066, inset 0 1px 2px #ffffff44;
  }

  /* ── IO test mode ── */
  .test-btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 4px 16px;
    cursor: pointer;
    background: #c0c0c0;
    color: #000;
    border-top:    2px solid #fff;
    border-left:   2px solid #fff;
    border-right:  2px solid #404040;
    border-bottom: 2px solid #404040;
  }
  .test-btn.on { background: #e07000; color: #fff; }
  #test-banner {
    display: none;
    background: #e07000;
    color: #fff;
    font-weight: bold;
    font-size: 17px;
    letter-spacing: 1px;
    padding: 8px 15px;
    margin-bottom: 15px;
  }
  body.io-test #test-banner { display: block; }
  #test-msg { margin-left: 12px; font-weight: normal; }

  .do-ctl { display: none; gap: 4px; margin-right: 10px; }
  body.io-test .do-ctl { display: flex; }
  .do-ctl button {
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    width: 54px;
    height: 36px;
    cursor: pointer;
    background: #c0c0c0;
    border-top:    2px solid #fff;
    border-left:   2px solid #fff;
    border-right:  2px solid #404040;
    border-bottom: 2px solid #404040;
  }
  .do-ctl button:active {
    border-top:    2px solid #404040;
    border-left:   2px solid #404040;
    border-right:  2px solid #fff;
    border-bottom: 2px solid #fff;
  }
  .do-ctl button.sel-on  { background: #40a040; color: #fff; }
  .do-ctl button.sel-off { background: #606060; color: #fff; }
  .do-ctl button.sel-auto { background: #000080; color: #fff; }
  .io-row.forced .io-idx { background: #e07000; color: #fff; font-weight: bold; }

  /* ── Nav bar ── */
  #nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 86px;
    background: #1a1a6e;
    display: flex;
    z-index: 200;
    border-top: 2px solid #4040a0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a0a0e0;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    text-transform: uppercase;
    border-right: 2px solid #3030a0;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn.active { background: #0000c0; color: #fff; border-top: 2px solid #8080ff; }
  .nav-btn:hover:not(.active) { background: #0000a0; color: #e0e0ff; }
  .nav-btn.errors-btn { color: #ff8080; }
  .nav-btn.errors-btn.active { background: #800000; color: #fff; border-top: 2px solid #ff8080; }
</style>
</head>
<body>

<div id="header" class="raised">
  <span class="title">AGV IO MONITOR</span>
  <button id="test-btn" class="test-btn">IO TEST: OFF</button>
  <span id="mode-badge" class="mode-badge">MODE: —</span>
  <span id="ts">—</span>
</div>

<div id="test-banner">
  IO TEST MODE — DO outputs forced from this page override the program. AUTO = give the pin back.
  Exits automatically if the AGV starts RUNNING / REVERSING.
  <span id="test-msg"></span>
</div>

<div class="columns">
  <div class="panel raised">
    <div class="panel-title">DIGITAL INPUTS [ DI ]</div>
    <div class="panel-body" id="di-panel"></div>
  </div>
  <div class="panel raised">
    <div class="panel-title">DIGITAL OUTPUTS [ DO ]</div>
    <div class="panel-body" id="do-panel"></div>
  </div>
</div>

<nav id="nav-bar">
  <a class="nav-btn" href="/">HOME</a>
  <a class="nav-btn" href="/manual">MANUAL</a>
  <a class="nav-btn active" href="/io">IO</a>
  <a class="nav-btn" href="/params">PARAMS</a>
  <a class="nav-btn errors-btn" href="/errors">ERRORS</a>
</nav>

<script>
let diNames = [], doNames = [], numDi = 16, numDo = 16;
let initialised = false;

let testMode = false;
let btnHoldUntil = 0;   // keep a confirm/error text on the button briefly
let forced   = {};   // {"ch": true|false}

function postJSON(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(r => r.json());
}

function showTestMsg(text, err) {
  const m = document.getElementById('test-msg');
  m.textContent = text || '';
  m.style.color = err ? '#ffff80' : '#fff';
  if (text) setTimeout(() => { if (m.textContent === text) m.textContent = ''; }, 4000);
}

function applyTestUi() {
  document.body.classList.toggle('io-test', testMode);
  const b = document.getElementById('test-btn');
  b.classList.toggle('on', testMode);
  if (Date.now() >= btnHoldUntil) b.textContent = 'IO TEST: ' + (testMode ? 'ON' : 'OFF');
  for (let i = 0; i < numDo; i++) {
    const f   = forced[String(i)];
    const row = document.getElementById('do-row-' + i);
    if (!row) continue;
    row.classList.toggle('forced', f !== undefined);
    row.querySelector('[data-v="on"]').className   = f === true      ? 'sel-on'   : '';
    row.querySelector('[data-v="off"]').className  = f === false     ? 'sel-off'  : '';
    row.querySelector('[data-v="auto"]').className = f === undefined ? 'sel-auto' : '';
  }
}

document.getElementById('test-btn').addEventListener('click', () => {
  if (!testMode && !confirmTest()) return;
  postJSON('/api/io/test', { enable: !testMode })
    .then(d => {
      if (d.ok) { btnHoldUntil = 0; testMode = d.io_test_mode; if (!testMode) forced = {}; applyTestUi(); }
      else alertMsg(d.error);
    })
    .catch(() => alertMsg('NO CONNECTION'));
});

function confirmTest() {
  // Inline confirm instead of a browser dialog: first click arms, second
  // click within 3 s enters test mode.
  const b = document.getElementById('test-btn');
  if (b.dataset.armed === '1') { b.dataset.armed = ''; return true; }
  b.dataset.armed = '1';
  b.textContent = 'CLICK AGAIN TO CONFIRM';
  btnHoldUntil = Date.now() + 3000;
  setTimeout(() => { b.dataset.armed = ''; applyTestUi(); }, 3000);
  return false;
}

function alertMsg(text) {
  const b = document.getElementById('test-btn');
  b.textContent = text;
  btnHoldUntil = Date.now() + 3000;
  setTimeout(applyTestUi, 3000);
}

function setDo(ch, v) {
  const value = v === 'on' ? true : v === 'off' ? false : null;
  postJSON('/api/io/do', { channel: ch, value })
    .then(d => {
      if (!d.ok) { showTestMsg(d.error, true); return; }
      if (value === null) delete forced[String(ch)]; else forced[String(ch)] = value;
      applyTestUi();
    })
    .catch(() => showTestMsg('NO CONNECTION', true));
}

function buildPanel(panelId, count, names) {
  const panel = document.getElementById(panelId);
  panel.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const name  = names[i] || '[SPARE]';
    const spare = name === '[SPARE]';
    const row   = document.createElement('div');
    row.className = 'io-row';
    const ctl = panelId === 'do-panel'
      ? `<span class="do-ctl">` +
          `<button data-v="on">ON</button>` +
          `<button data-v="off">OFF</button>` +
          `<button data-v="auto">AUTO</button>` +
        `</span>`
      : '';
    if (panelId === 'do-panel') row.id = 'do-row-' + i;
    row.innerHTML =
      `<span class="io-idx">${i}</span>` +
      `<span class="io-name${spare ? ' spare' : ''}">${name}</span>` +
      ctl +
      `<span class="lamp" id="${panelId}-${i}"></span>`;
    if (panelId === 'do-panel') {
      row.querySelectorAll('.do-ctl button').forEach(btn =>
        btn.addEventListener('click', () => setDo(i, btn.dataset.v)));
    }
    panel.appendChild(row);
  }
}

function setLamp(id, on) {
  const el = document.getElementById(id);
  if (el) el.className = 'lamp' + (on ? ' on' : '');
}

function fetchIO() {
  fetch('/api/io')
    .then(r => r.json())
    .then(d => {
      if (!initialised) {
        diNames = d.di_names; doNames = d.do_names;
        numDi = d.num_di;     numDo  = d.num_do;
        buildPanel('di-panel', numDi, diNames);
        buildPanel('do-panel', numDo, doNames);
        initialised = true;
      }
      d.di.forEach((v, i) => setLamp('di-panel-' + i, v));
      d.do.forEach((v, i) => setLamp('do-panel-' + i, v));
      // Sync test mode / forced pins from the server (page reload, other
      // tabs, or mode_manager auto-exiting test mode when the AGV starts).
      testMode = !!d.io_test_mode;
      forced   = d.do_forced || {};
      applyTestUi();
      document.getElementById('ts').textContent = new Date().toLocaleTimeString();
    })
    .catch(() => { document.getElementById('ts').textContent = 'NO CONN'; });
}

function fetchMode() {
  fetch('/api/state')
    .then(r => r.json())
    .then(d => {
      const mode  = d.agv && d.agv.mode;
      const badge = document.getElementById('mode-badge');
      badge.textContent = 'MODE: ' + (mode ? mode.toUpperCase() : '—');
      badge.className   = 'mode-badge' + (mode ? ' mode-' + mode : '');
    }).catch(() => {});
}

fetchIO();
fetchMode();
setInterval(fetchIO,   500);
setInterval(fetchMode, 1000);
</script>
{% include '_engineer.html' %}
</body>
</html>
